name: Set up Nix
description: Install Nix and restore (and optionally save) the Nix store cache, keyed on flake.nix, flake.lock and the runner.

inputs:
  key-prefix:
    description: Prefix of the cache key. Give each distinct store content its own prefix.
    default: nix
  save:
    description: Save the Nix store cache at the end of the job. Defaults to saving only on push events, so that pull requests only restore.
    default: ${{ github.event_name == 'push' }}

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    # The store is garbage-collected to the limit just before saving, below GitHub's 10 GiB cache quota per repository.
    - name: Cache the Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: ${{ inputs.key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: ${{ inputs.key-prefix }}-${{ runner.os }}-${{ runner.arch }}-
        save: ${{ inputs.save }}
        gc-max-store-size: 5G
