name: Release publish (reusable)

on:
  workflow_call:
    inputs:
      tag-name:
        description: Tag of the draft release to attach the artifacts to (the tag_name output of release-pr.yml)
        required: true
        type: string
      artifact-name:
        description: Name of the workflow artifact that holds the files to attest and upload
        required: false
        type: string
        default: release-artifacts

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-publish:
    name: release-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # upload assets and publish the draft release
      id-token: write # sign the attestation
      attestations: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.tag-name }}
      ARTIFACT_NAME: ${{ inputs.artifact-name }}
    steps:
      - name: Verify release target
        run: |
          set -euo pipefail

          # Provenance names the commit of this run, so the tag must point to it.
          tag_sha="$(gh api "repos/$GH_REPO/commits/$TAG_NAME" --jq .sha)"
          if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "$TAG_NAME points to $tag_sha, but this run is for $GITHUB_SHA."
            exit 1
          fi

          # Re-uploading with --clobber deletes assets first, so never touch a published release.
          is_draft="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "$TAG_NAME is already published; ship fixes as a new release instead."
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: release-artifacts

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-artifacts/*

      - name: Upload release artifacts
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(release-artifacts/*)
          if ((${#files[@]} == 0)); then
            echo "The artifact $ARTIFACT_NAME holds no files."
            exit 1
          fi

          gh release upload "$TAG_NAME" "${files[@]}" --clobber

      - name: Publish release
        run: |
          set -euo pipefail

          # Publishing without make_latest marks the release latest. An older tag's run can finish
          # last, so let GitHub pick latest by date and semantic version.
          release_id="$(gh release view "$TAG_NAME" --json databaseId --jq .databaseId)"
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=legacy
