name: ADR lint (reusable)

on:
  workflow_call:
    inputs:
      adr-dir:
        description: Directory of the MADR ADRs, relative to the repository root
        required: false
        type: string
        default: docs/adr
      agent-config-ref:
        description: Full commit SHA of furedea/agent-config whose adr-check command is run
        type: string
        # renovate: depName=furedea/agent-config
        default: 138c542e3eec5ae6ec9e7080b619af6ee9b9fd0b

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  adr-lint:
    name: adr-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # nixos-unstable revision that provides markdownlint-cli2 and lychee, the one of nix-lint.yml and gha-lint.yml;
      # Renovate updates it. adr-check is not pinned here: it comes from agent-config at `agent-config-ref`, so that CI
      # runs the adr-check that the agent hooks run.
      NIXPKGS_REV: f9a75f41be3a74eab55d3a7679d34ad6cc0da977
      ADR_DIR: ${{ inputs.adr-dir }}
      AGENT_CONFIG_REF: ${{ inputs.agent-config-ref }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      # The full history gives adr-check the base commit of a pull request.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # markdownlint-cli2 applies the nearest config of a directory (also one in a parent directory) instead of merging
      # it with --config, so the settings are placed in <adr-dir>/.markdownlint.yml inside this job's workspace: the
      # MADR base alone, or the caller's file made to extend it (the caller's keys then win over the base).
      - name: Run markdownlint
        run: |
          base="$RUNNER_TEMP/markdownlint-base.yml"
          caller="$ADR_DIR/.markdownlint.yml"
          # The MADR project's own settings.
          printf '%s\n' 'default: true' 'MD013: false' 'MD024: false' >"$base"
          if [[ ! -f $caller ]]; then
            cp "$base" "$caller"
          elif grep -Eq '^["'"'"']?extends["'"'"']?[[:space:]]*:' "$caller"; then
            echo "::error::$ADR_DIR/.markdownlint.yml has its own extends; it cannot be combined with the MADR base settings. Put MD013: false and MD024: false in the file or in the config it extends."
            exit 1
          else
            { printf 'extends: %s\n' "$base"; sed '1{/^---[[:space:]]*$/d;}' "$caller"; } >"$RUNNER_TEMP/markdownlint-caller.yml"
            cp "$RUNNER_TEMP/markdownlint-caller.yml" "$caller"
          fi
          nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#markdownlint-cli2" -- "$ADR_DIR/**/*.md"

      - name: Run lychee
        run: nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#lychee" -- --offline --no-progress "$ADR_DIR"

      - name: Run adr-check
        run: |
          args=()
          if [[ -n $BASE_SHA ]]; then
            args+=(--base "$BASE_SHA")
          fi
          nix run "github:furedea/agent-config/$AGENT_CONFIG_REF#adr-check" -- "${args[@]}" "$ADR_DIR"
