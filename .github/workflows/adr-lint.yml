name: ADR lint (reusable)

on:
  workflow_call:
    inputs:
      adr-dir:
        description: Directory of the MADR ADRs, relative to the repository root
        required: false
        type: string
        default: docs/adr
      madr-from:
        description: Number of the first ADR whose headings must follow the MADR structure; 1 checks every ADR
        required: false
        type: number
        default: 1
      agent-config-ref:
        description: Full commit SHA of furedea/agent-config whose adr-check command is run
        type: string
        # renovate: depName=furedea/agent-config
        default: 138c542e3eec5ae6ec9e7080b619af6ee9b9fd0b

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  adr-lint:
    name: adr-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # nixos-unstable revision that provides markdownlint-cli2 and lychee, the one of nix-lint.yml and gha-lint.yml;
      # Renovate updates it. adr-check is not pinned here: it comes from agent-config at `agent-config-ref`, so that CI
      # runs the adr-check that the agent hooks run.
      NIXPKGS_REV: f9a75f41be3a74eab55d3a7679d34ad6cc0da977
      ADR_DIR: ${{ inputs.adr-dir }}
      MADR_FROM: ${{ inputs.madr-from }}
      AGENT_CONFIG_REF: ${{ inputs.agent-config-ref }}
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
    steps:
      # The full history gives adr-check the base commit of a pull request.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # The settings are the caller's: markdownlint-cli2 uses <adr-dir>/.markdownlint.yml (see the README).
      - name: Run markdownlint
        run: nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#markdownlint-cli2" -- "$ADR_DIR/**/*.md"

      # MD043 over the ADRs numbered at or above `madr-from`, with a fixed config that enables only that rule. The files
      # are copied beside the config because markdownlint-cli2 would otherwise prefer the caller's nearest config.
      - name: Check MADR headings
        run: |
          madr_dir=$(mktemp -d)
          cat > "$madr_dir/.markdownlint.yml" <<'EOF'
          default: false
          MD043:
            headings:
              - "?"
              - "## Context and Problem Statement"
              - "*"
              - "## Considered Options"
              - "*"
              - "## Decision Outcome"
              - "*"
          EOF
          count=0
          for file in "$ADR_DIR"/[0-9][0-9][0-9][0-9]_*.md; do
            [[ -e $file ]] || continue
            number=$(basename "$file")
            number=$((10#${number%%_*}))
            if ((number >= MADR_FROM)); then
              cp "$file" "$madr_dir/"
              count=$((count + 1))
            fi
          done
          if ((count == 0)); then
            echo "No ADR is numbered at or above $MADR_FROM; skipping."
            exit 0
          fi
          nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#markdownlint-cli2" -- "$madr_dir/*.md"

      - name: Run lychee
        run: nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#lychee" -- --offline --no-progress "$ADR_DIR"

      - name: Run adr-check
        run: |
          args=()
          if [[ -n $BASE_SHA ]]; then
            args+=(--base "$BASE_SHA")
          fi
          nix run "github:furedea/agent-config/$AGENT_CONFIG_REF#adr-check" -- "${args[@]}" "$ADR_DIR"
