name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # actionlint does not support the $/ self-repository syntax yet (rhysd/actionlint#711). Once it does,
  # switch these calls to $/ and drop the zizmor suppressions (furedea/reusable-workflows#10).
  gha-lint:
    uses: ./.github/workflows/gha-lint.yml # zizmor: ignore[self-repository]
    permissions:
      actions: read
      contents: read

  dependency-review:
    uses: ./.github/workflows/dependency-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  nix-lint:
    uses: ./.github/workflows/nix-lint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  nix-check:
    uses: ./.github/workflows/nix-check.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # Runs the composite action at this commit, as the calls above do for the workflows.
  nix-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-setup # zizmor: ignore[self-repository]

      - name: Check that Nix works
        run: nix --version

  # Calls the reusable workflow on the conforming fixtures; the workflow resolves its own composite action
  # at this commit through job.workflow_sha.
  adr-lint:
    uses: ./.github/workflows/adr-lint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
    with:
      adr-dir: tests/adr-lint/fixtures/valid

  # Runs the scripts of the adr-front-matter action against conforming and violating fixtures.
  adr-front-matter-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NIXPKGS_REV: f9a75f41be3a74eab55d3a7679d34ad6cc0da977
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Run bats
        run: nix shell "github:NixOS/nixpkgs/$NIXPKGS_REV#bats" "github:NixOS/nixpkgs/$NIXPKGS_REV#yq-go" "github:NixOS/nixpkgs/$NIXPKGS_REV#git" --command bats tests/adr_front_matter.bats

  claude-review:
    uses: ./.github/workflows/claude-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  codex-review:
    uses: ./.github/workflows/codex-review.yml # zizmor: ignore[self-repository]
    permissions: {}
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}

  all-green:
    if: always()
    needs:
      - gha-lint
      - dependency-review
      - nix-lint
      - nix-check
      - nix-setup
      - adr-lint
      - adr-front-matter-test
      - claude-review
      - codex-review
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail if any prerequisite did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
