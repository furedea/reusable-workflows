name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # actionlint does not support the $/ self-repository syntax yet (rhysd/actionlint#711). Once it does,
  # switch these calls to $/ and drop the zizmor suppressions (furedea/reusable-workflows#10).
  gha-lint:
    uses: ./.github/workflows/gha-lint.yml # zizmor: ignore[self-repository]
    permissions:
      actions: read
      contents: read

  dependency-review:
    uses: ./.github/workflows/dependency-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  nix-lint:
    uses: ./.github/workflows/nix-lint.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  nix-check:
    uses: ./.github/workflows/nix-check.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  # Runs the composite action at this commit, as the calls above do for the workflows.
  nix-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/nix-setup # zizmor: ignore[self-repository]

      - name: Check that Nix works
        run: nix --version

  claude-review:
    uses: ./.github/workflows/claude-review.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  codex-review:
    uses: ./.github/workflows/codex-review.yml # zizmor: ignore[self-repository]
    permissions: {}
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}

  all-green:
    if: always()
    needs:
      - gha-lint
      - dependency-review
      - nix-lint
      - nix-check
      - nix-setup
      - claude-review
      - codex-review
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail if any prerequisite did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
