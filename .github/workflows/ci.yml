name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gha-lint:
    uses: ./.github/workflows/gha-lint.yml
    permissions:
      actions: read
      contents: read

  # Exercises the workflow-template-dir input against a fixture.
  gha-lint-templates:
    uses: ./.github/workflows/gha-lint.yml
    permissions:
      actions: read
      contents: read
    with:
      workflow-template-dir: .github/test-templates

  dependency-review:
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read

  nix-lint:
    uses: ./.github/workflows/nix-lint.yml
    permissions:
      contents: read

  claude-review:
    uses: ./.github/workflows/claude-review.yml
    permissions:
      contents: read
      pull-requests: write
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  codex-review:
    uses: ./.github/workflows/codex-review.yml
    permissions: {}
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}

  all-green:
    if: always()
    needs:
      - gha-lint
      - gha-lint-templates
      - dependency-review
      - nix-lint
      - claude-review
      - codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Fail if any prerequisite did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
