name: ast-grep (reusable)

on:
  workflow_call:
    inputs:
      agent-config-ref:
        description: Full commit SHA of furedea/agent-config whose ast-grep rules are applied
        type: string
        # renovate: depName=furedea/agent-config
        default: da23715e33372511d4ce73dedc16b12fa2765fe2

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ast-grep:
    name: ast-grep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # nixpkgs revision that provides ast-grep 0.42.1, the revision in agent-config's flake.lock. Update it together
      # with agent-config's, not to the head of nixos-unstable, so that CI and the agent hooks run the same ast-grep.
      NIXPKGS_REV: 21691b79c41ba30a80b110523c943d8d45a0912b
      RULES_DIR: .agent-config-rules
    steps:
      # Only a pull request has a diff to filter by; every other event succeeds without scanning.
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Checkout the ast-grep rules
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: furedea/agent-config
          ref: ${{ inputs.agent-config-ref }}
          path: ${{ env.RULES_DIR }}
          persist-credentials: false

      - name: Install Nix
        if: github.event_name == 'pull_request'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # HEAD is the merge commit of the pull request and HEAD^1 its base, so the diff holds exactly the lines the
      # pull request changes, in the line numbers of the tree that is scanned.
      - name: Scan changed lines
        if: github.event_name == 'pull_request'
        run: |
          ast_grep() { nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#ast-grep" -- "$@"; }

          mapfile -d '' changed < <(git diff -z --name-only -M --diff-filter=ACMR HEAD^1 HEAD)
          if ((${#changed[@]} == 0)); then
            echo "No added or modified files."
            exit 0
          fi

          findings="$(mktemp)"
          set +e
          ast_grep scan --config "$RULES_DIR/agents/hooks/lint/sgconfig.yml" --json=stream -- "${changed[@]}" >"$findings"
          status=$?
          set -e
          # ast-grep exits 1 when it found an error-level finding, and also for a broken configuration or rule. An
          # error-level finding is always in the output, so status 1 with no output is a failure to scan.
          if ((status > 1)) || { ((status == 1)) && [[ ! -s $findings ]]; }; then
            echo "::error::ast-grep failed with exit status $status"
            exit 1
          fi

          python3 -c '
          import json, re, subprocess, sys

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout

          # Name the files with -z and ask for each one separately: the "+++" header of a diff quotes or pads
          # unusual paths, so it cannot be compared with the path that ast-grep reports. A renamed file is diffed
          # with its source, so that only the lines it really changes count.
          changed = {}
          tokens = git("diff", "-z", "--name-status", "-M", "--diff-filter=ACMR", "HEAD^1", "HEAD").split("\0")
          index = 0
          while index + 1 < len(tokens):
              paths = tokens[index + 1 : index + (3 if tokens[index][0] in "RC" else 2)]
              index += 1 + len(paths)
              lines = changed.setdefault(paths[-1], set())
              for line in git("diff", "-U0", "-M", "HEAD^1", "HEAD", "--", *paths).splitlines():
                  if m := re.match(r"@@ -\S+ \+(\d+)(?:,(\d+))? @@", line):
                      start, count = int(m[1]), int(m[2] if m[2] is not None else 1)
                      lines.update(range(start, start + count))

          def escape(text, property=False):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return text.replace(":", "%3A").replace(",", "%2C") if property else text

          level = {"error": "error", "warning": "warning"}
          failed = False
          with open(sys.argv[1]) as stream:
              for raw in stream:
                  try:
                      f = json.loads(raw)
                  except ValueError:
                      continue
                  first, last = f["range"]["start"]["line"] + 1, f["range"]["end"]["line"] + 1
                  if not changed.get(f["file"], set()).intersection(range(first, last + 1)):
                      continue
                  kind = level.get(f["severity"], "notice")
                  failed = failed or kind == "error"
                  text = f["message"] + (" Fix: " + f["note"] if f.get("note") else "")
                  where = "file=%s,line=%d,endLine=%d,title=%s" % (escape(f["file"], True), first, last, escape(f["ruleId"], True))
                  print("::%s %s::%s" % (kind, where, escape(text)))
          sys.exit(1 if failed else 0)
          ' "$findings"
