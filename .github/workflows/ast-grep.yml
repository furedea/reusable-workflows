name: ast-grep (reusable)

on:
  workflow_call:
    inputs:
      agent-config-ref:
        description: Full commit SHA of furedea/agent-config whose ast-grep rules are applied
        type: string
        # renovate: depName=furedea/agent-config
        default: da23715e33372511d4ce73dedc16b12fa2765fe2

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ast-grep:
    name: ast-grep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # nixpkgs revision that provides ast-grep 0.42.1 and reviewdog 0.21.0, the revision in agent-config's flake.lock.
      # Update it with agent-config's, not to the head of nixos-unstable, so that CI and the agent hooks run the
      # same tools.
      NIXPKGS_REV: 21691b79c41ba30a80b110523c943d8d45a0912b
      RULES_DIR: .agent-config-rules
    steps:
      # Only a pull request has a diff to filter by; every other event succeeds without scanning.
      - name: Checkout repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Checkout the ast-grep rules
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: furedea/agent-config
          ref: ${{ inputs.agent-config-ref }}
          path: ${{ env.RULES_DIR }}
          persist-credentials: false

      - name: Install Nix
        if: github.event_name == 'pull_request'
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # HEAD is the merge commit of the pull request and HEAD^1 its base, so the diff holds exactly the lines the
      # pull request changes, in the line numbers of the tree that is scanned.
      #
      # ast-grep writes SARIF, which reviewdog parses natively. The first reviewdog keeps the findings on added or
      # modified lines (`-filter-mode=added`) and rewrites them as rdjsonl. The second turns them into workflow
      # annotations and fails on `error`; the annotation reporter does not filter by diff by itself, and the
      # reporter that does needs the GitHub API. Neither reaches the network, so the token below is a placeholder
      # that the annotation reporter insists on.
      - name: Scan changed lines
        if: github.event_name == 'pull_request'
        run: |
          export REVIEWDOG_GITHUB_API_TOKEN=unused
          ast_grep() { nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#ast-grep" -- "$@"; }
          reviewdog() { nix run "github:NixOS/nixpkgs/$NIXPKGS_REV#reviewdog" -- "$@"; }

          mapfile -d '' changed < <(git diff -z --name-only -M --diff-filter=ACMR HEAD^1 HEAD)
          if ((${#changed[@]} == 0)); then
            echo "No added or modified files."
            exit 0
          fi

          sarif="$(mktemp)"
          status=0
          ast_grep scan --config "$RULES_DIR/agents/hooks/lint/sgconfig.yml" --format sarif -- "${changed[@]}" >"$sarif" || status=$?
          # ast-grep exits 1 for error-level findings and for a broken configuration alike, and writes SARIF only
          # when it scanned, so no output means that nothing was scanned.
          if ((status > 1)) || [[ ! -s $sarif ]]; then
            echo "::error::ast-grep failed with exit status $status"
            exit 1
          fi

          reviewdog -f=sarif -name=ast-grep -reporter=rdjsonl -filter-mode=added -diff="git diff -M HEAD^1 HEAD" <"$sarif" |
            reviewdog -f=rdjsonl -name=ast-grep -reporter=github-annotations -filter-mode=nofilter -fail-level=error
