name: Codex review comment

# Re-evaluates the Codex gate when a review thread gets a reply (the resolve follows it).
on:
  pull_request_review_comment:
    types:
      - created

permissions: {}

jobs:
  codex-review:
    uses: ./.github/workflows/codex-review.yml # zizmor: ignore[self-repository]
    permissions:
      pull-requests: read
      statuses: write
    secrets:
      codex_review_token: ${{ secrets.CODEX_REVIEW_TOKEN }}
