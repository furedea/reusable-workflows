name: Nix check (reusable)

on:
  workflow_call:
    inputs:
      all-systems:
        description: >-
          Also run `nix flake check --all-systems --no-build` to evaluate every system's outputs. Set to false for
          flakes that use import-from-derivation (for example `builtins.pathExists` on a derivation output): they
          cannot evaluate foreign-system outputs without building them, so `--no-build` fails on the Linux runner
          for their darwin outputs.
        type: boolean
        required: false
        default: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  nix-check:
    name: nix-check
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Check the runner's system
        run: nix flake check -L

      - name: Evaluate every system
        if: inputs.all-systems
        run: nix flake check --all-systems --no-build
