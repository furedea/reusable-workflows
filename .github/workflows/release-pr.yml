name: Release PR (reusable)

on:
  workflow_call:
    inputs:
      app-client-id:
        description: Client ID of the release GitHub App (the caller's variable RELEASE_APP_CLIENT_ID)
        required: true
        type: string
      config-file:
        description: Path of the release-please config file
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path of the release-please manifest file
        required: false
        type: string
        default: .release-please-manifest.json
    secrets:
      app_private_key:
        description: Private key of the release GitHub App (the caller's secret RELEASE_APP_PRIVATE_KEY)
        required: true
    outputs:
      release_created:
        description: "'true' when this run created a (draft) release"
        value: ${{ jobs.release-pr.outputs.release_created }}
      tag_name:
        description: Tag of the created release; empty when none was created
        value: ${{ jobs.release-pr.outputs.tag_name }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  release-pr:
    name: release-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A release PR opened with GITHUB_TOKEN does not trigger CI, so sign in as the release App.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Create or update release PR, or create release
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
