paths:
  # The pinned actionlint does not know the job.workflow_* context properties yet, which a reusable
  # workflow needs to check out its own repository at the called commit.
  .github/workflows/adr-lint.yml:
    ignore:
      - 'property "workflow_repository" is not defined in object type'
      - 'property "workflow_sha" is not defined in object type'
